name: CI

on:
  push:
    branch: [advanced]

jobs:
  frontend-code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
      
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install npm packages
        run: npm ci
        working-directory: frontend
      
      - name: Run Linter
        run: npm run lint
        working-directory: frontend

      - name: Run Tests
        run: npm run test
        working-directory: frontend
