name: CI
# This is the Workflow for both Frontend and Backend
on:
  push:
    branch: [advanced]

jobs:

# FRONTEND App

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
      
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install npm packages
        run: npm ci
        working-directory: frontend
      
      - name: Run Linter
        run: npm run lint
        working-directory: frontend

      - name: Run Tests
        run: npm run test
        working-directory: frontend

# BACKEND

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
      
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Run Go Formatting
        run: go fmt
        working-directory: backend
      
      - name: Run Go Vet
        run: go vet
        working-directory: backend

      - name: Run Tests
        run: go test
        working-directory: backend

  
  build_and_test:
    needs: [frontend,backend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ['frontend','backend']
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{matrix.folder}}
          push: true
          tags: ${{vars.DOCKERHUB_USERNAME}}/docker-${{matrix.folder}}-img:latest

  deploy:
    needs: [frontend,backend,build_and_test]
    uses: ./.github/workflows/cd.yml
    secrets: inherit