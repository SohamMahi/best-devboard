# To ensure that no Secrets or keys have been leaked in the code

name: Secrets-Scanner

on:
  workflow_call:

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Code Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Git Leaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}