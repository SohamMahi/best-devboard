name: DevSecOps

on:
  push:
    branches: [advanced]

jobs:

# Check the Code Quality 
  code-quality:
    uses: ./.github/workflows/code_quality.yml

# Check the Secret Scan
  secrets-scan:
    uses: ./.github/workflows/secrets-scanning.yml

# Check the Dependancy Scan
  dependancy-checks:
    uses: ./.github/workflows/dependancy-scan.yml

# Check the Docker Scan
  docker-scan:
    uses: ./.github/workflows/docker-scan.yml
    secrets: inherit

# Check the Sonar Scan of your whole application
  sonar-scan:
    uses: ./.github/workflows/sonarqube-scan.yml
    secrets: inherit

# Check the tests of your whole application
  test-checks:
    uses: ./.github/workflows/code-test.yml

# Deploy the application post all checks
  deploy-build:
    uses: ./.github/workflows/code-deploy.yml
    needs: [code-quality,secrets-scan,docker-scan,dependancy-checks,sonar-scan,test-checks]
    secrets: inherit