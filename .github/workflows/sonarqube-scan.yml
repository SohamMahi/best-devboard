name: Sonar Qube Scan

on:
    workflow_call:

jobs:
    sonar-qube-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Clone
              uses: actions/checkout@v7

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8.3.0
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
