name: Docker scan

on:
    workflow_call:

jobs:
    docker-scan:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folder: ['frontend','backend']
        steps:
            - name: Clone the code
              uses: actions/checkout@v7

            - name: ${{ matrix.folder }} Docker Lint
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dockerfile: ${{ matrix.folder}}/Dockerfile  

            -
             name: Login to Docker Hub
             uses: docker/login-action@v4
             with:
                username: ${{vars.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}
            -
             name: Docker build ${{ matrix.folder}}
             run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/docker-scan-${{ matrix.folder }}:v1 .
             working-directory: ${{ matrix.folder}}
 
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: '${{vars.DOCKERHUB_USERNAME}}/docker-scan-${{matrix.folder}}:v1'
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL'
            
