name : CD

on:
  workflow_call:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Code checkout
        uses: actions/checkout@v6
      
      - name: Copy the example env to main env
        run: cp .env.example .env
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Deploy the build with Docker Compose
        run: |
          docker compose pull
          docker compose up -d